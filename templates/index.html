{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}
<!-- ===== SEARCH BAR ===== -->
<div class="search-box">
    <input type="text" id="indexSearch" placeholder="Search products...">
    <div id="searchSuggestions" class="search-suggestions"></div>
</div>
<!-- ===== PRODUCT GRID ===== -->
<div class="grid" id="productContainer">
    {% if products %}
        {% for product in products %}
        <div class="card">

            <img src="{{ product.image }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p class="price">₹{{ product.price }}</p>

            <!-- Cart Control Container -->
            <div id="cart-control-{{ product.id }}">
                <button onclick="addToCart({{ product.id }}, this)">
                    Add to Cart
                </button>
            </div>

        </div>
        {% endfor %}
    {% else %}
        <p>No products found</p>
    {% endif %}
</div>


<!-- ===== STYLES ===== -->
<style>

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
}

.price {
    font-weight: bold;
    margin: 10px 0;
}

button {
    padding: 8px 15px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

/* Quantity Style */
.qty-control {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.qty-btn {
    background: #007bff;
    color: white;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 5px;
    cursor: pointer;
}

.qty-number {
    font-weight: bold;
    min-width: 20px;
}

</style>
<script>
document.addEventListener("DOMContentLoaded", function () {

    const searchInput = document.getElementById("indexSearch");
    const container = document.getElementById("productContainer");

    let debounceTimer;

    searchInput.addEventListener("input", function () {

        clearTimeout(debounceTimer);

        const query = this.value.trim();

        debounceTimer = setTimeout(() => {

            fetch("/search?q=" + encodeURIComponent(query))
                .then(res => res.json())
                .then(products => {

                    container.innerHTML = "";

                    if (!products || products.length === 0) {
                        container.innerHTML = "<p>No products found</p>";
                        return;
                    }

                    products.forEach(p => {

                        const card = document.createElement("div");
                        card.className = "card";

                        let imageHTML = "";
                        if (p.image) {
                            imageHTML = `<img src="${p.image}" alt="${p.name}">`;
                        } else {
                            imageHTML = `<div class="image-placeholder"></div>`;
                        }

                        card.innerHTML = `
                            ${imageHTML}
                            <h3>${p.name}</h3>
                            <p class="price">₹${p.price}</p>

                            <div id="cart-control-${p.id}">
                                <button onclick="addToCart(${p.id})">
                                    Add to Cart
                                </button>
                            </div>
                        `;

                        container.appendChild(card);

                    });

                })
                .catch(err => console.error("Search error:", err));

        }, 300);

    });

});
</script>
{% endblock %}
