<!DOCTYPE html>

<html>
<head>
    <title>Index Mart</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

```
    /* Header */
    .header {
        background: linear-gradient(90deg, #ff416c, #ff4b2b);
        color: white;
        padding: 12px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .search-bar input {
        width: 320px;
        padding: 10px;
        border-radius: 25px;
        border: none;
    }

    .login a {
        color: white;
        margin-left: 15px;
        text-decoration: none;
        font-weight: bold;
    }

    /* Products */
    .products {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        padding: 20px;
    }

    .card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 0 5px #ccc;
    }

    .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
    }

    button {
        background: #ff3f6c;
        color: white;
        border: none;
        padding: 8px;
        margin-top: 10px;
        cursor: pointer;
        border-radius: 5px;
    }
</style>
```

</head>

<body>

<!-- Header -->

<div class="header">

```
<h2>🛒 Index Mart</h2>

<div class="search-bar">
    <input type="text" placeholder="Search products...">
</div>

<div class="login">
    {% if user %}
        <span>Welcome {{ user }}</span>
        <a href="/logout">Logout</a>
    {% else %}
        <a href="/login">Login</a>
    {% endif %}
    <a href="/cart">Cart</a>
</div>
```

</div>

<!-- Product Section -->

<div class="products">

{% for product in products %} <div class="card"> <img src="{{ product.image }}"> <h3>{{ product.name }}</h3> <p>₹{{ product.price }}</p> <button onclick="addToCart('{{ product.name }}', {{ product.price }})">
Add to Cart </button> </div>
{% endfor %}

</div>

<script>
function addToCart(name, price) {
    fetch("/add_to_cart", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({name: name, price: price})
    })
    .then(res => res.json())
    .then(data => alert("Added to cart!"));
}
</script>

</body>
</html>
