{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}

<!-- ===== SEARCH BAR ===== -->
<div class="search-wrapper">
    <input type="text"
           id="searchInput"
           placeholder="Search products..."
           onkeyup="liveSearch()"
           autocomplete="off">
</div>

<!-- ===== PRODUCT GRID ===== -->
<div class="grid" id="productContainer">
    {% if products %}
        {% for product in products %}
        <div class="card">
            <img src="{{ product.image }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p class="price">₹{{ product.price }}</p>

           <button onclick="addToCart({{ product.id }}, this)">
    Add to Cart
</button>
        </div>
        {% endfor %}
    {% else %}
        <p>No products found</p>
    {% endif %}
</div>

<!-- ===== JAVASCRIPT ===== -->
<script>

// ---------- LIVE SEARCH ----------
function liveSearch() {
    const query = document.getElementById("searchInput").value;

    if (query.length === 0) {
        location.reload();
        return;
    }

    fetch(`/search?q=${query}`)
    .then(res => res.json())
    .then(data => {
        const container = document.getElementById("productContainer");
        container.innerHTML = "";

        if (data.length === 0) {
            container.innerHTML = "<p>No products found</p>";
            return;
        }

        data.forEach(p => {
            container.innerHTML += `
                <div class="card">
                    <img src="${p.image}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p class="price">₹${p.price}</p>
                    <button onclick="addToCart(${p.id})">
                        Add to Cart
                    </button>
                </div>
            `;
        });
    });
}

// ---------- ADD TO CART ----------
function addToCart(id) {
    fetch("/add_to_cart", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ id: id })
    })
    .then(res => {
        if (res.status === 401) {
            window.location.href = "/?login=1";
        } else {
            window.location.href = "/cart";
        }
    });
}

</script>

<!-- ===== STYLES ===== -->
<style>

.search-wrapper {
    margin-bottom: 20px;
}

#searchInput {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
}

.price {
    font-weight: bold;
    margin: 10px 0;
}

button {
    padding: 8px 15px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

</style>

{% endblock %}
