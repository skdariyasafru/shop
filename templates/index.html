{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}

<!-- ===== PRODUCT GRID ===== -->
<div class="grid">

    {% if products %}
        {% for product in products %}
        <div class="card">

            <img src="{{ product.image }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p class="price">₹{{ product.price }}</p>

            <div id="cart-control-{{ product.id }}">
                <button onclick="addToCart({{ product.id }})">
                    Add to Cart
                </button>
            </div>

        </div>
        {% endfor %}
    {% else %}
        <p>No products available</p>
    {% endif %}

</div>

<style>
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
}

.price {
    font-weight: bold;
    margin: 10px 0;
}
</style>

{% endblock %}
