{% extends "base.html" %}
{% block title %}Home{% endblock %}

{% block content %}

<!-- ===== PRODUCT GRID ===== -->
<div class="grid" id="productContainer">
    {% if products %}
        {% for product in products %}
        <div class="card">

            <img src="{{ product.image }}" alt="{{ product.name }}">
            <h3>{{ product.name }}</h3>
            <p class="price">₹{{ product.price }}</p>

            <!-- Cart Control Container -->
            <div id="cart-control-{{ product.id }}">
                <button onclick="addToCart({{ product.id }}, this)">
                    Add to Cart
                </button>
            </div>

        </div>
        {% endfor %}
    {% else %}
        <p>No products found</p>
    {% endif %}
</div>


<!-- ===== STYLES ===== -->
<style>

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
}

.price {
    font-weight: bold;
    margin: 10px 0;
}

button {
    padding: 8px 15px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #0056b3;
}

/* Quantity Style */
.qty-control {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.qty-btn {
    background: #007bff;
    color: white;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 5px;
    cursor: pointer;
}

.qty-number {
    font-weight: bold;
    min-width: 20px;
}

</style>

{% endblock %}
