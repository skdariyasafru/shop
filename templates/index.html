<!DOCTYPE html>

<html>
<head>
    <title>index  Mart</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }
/* Modern Header */
.header {
    background: linear-gradient(90deg, #ff416c, #ff4b2b);
    color: white;
    padding: 12px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.header h2 {
    margin: 0;
    font-size: 24px;
    letter-spacing: 1px;
}

/* Search bar */
.search-bar input {
    width: 320px;
    padding: 10px 15px;
    border-radius: 25px;
    border: none;
    outline: none;
    font-size: 14px;
    transition: 0.3s;
}

.search-bar input:focus {
    box-shadow: 0 0 5px rgba(255,255,255,0.8);
}

/* Login links */
.login a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 20px;
    transition: 0.3s;
}

.login a:hover {
    background: rgba(255,255,255,0.2);
}

   
    /* Products */
    .products {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        padding: 20px;
    }

    .card {
        background: white;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        box-shadow: 0 0 5px #ccc;
    }

    .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
    }

    button {
        background: #ff3f6c;
        color: white;
        border: none;
        padding: 8px;
        margin-top: 10px;
        cursor: pointer;
        border-radius: 5px;
    }

    button:hover {
        background: #d92f58;
    }
</style>
```

</head>

<body>

<!-- Header -->

<div class="header">
    <h2>index</h2>
    

<div style="display:flex; gap:20px; flex-wrap:wrap;">

{% for product in products %}
    <div style="border:1px solid #ccc; padding:10px; width:200px;">
        <img src="{{ product.image }}" width="150">
        <h3>{{ product.name }}</h3>
        <p>₹{{ product.price }}</p>
    </div>
{% endfor %}

</div>
<div class="search-bar">
    <input type="text" placeholder="Search products...">
</div>

<div class="login">
    <a href="/login">Login</a>
    <a href="/cart">Cart</a>
</div>
```

</div>

<!-- Product Section -->

<div class="products">

```
<div class="card">
    <img src="https://via.placeholder.com/200">

</div>

<div class="card">

```

</div>

<script>
function addToCart(name, price) {
    fetch("/add_to_cart", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({name: name, price: price})
    })
    .then(res => res.json())
    .then(data => alert("Added to cart!"));
}
</script>

</body>
</html>
