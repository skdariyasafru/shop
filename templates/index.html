{% extends "base.html" %}

{% block title %}Home{% endblock %}



{% block content %}

<div class="grid">

{% for product in products %}

<div class="card">
    <img src="{{ product.image }}">
    <h3>{{ product.name }}</h3>
    <p class="price">₹{{ product.price }}</p>
    <button onclick="addToCart('{{ product.name }}', {{ product.price }})">
        Add to Cart
    </button>
</div>
{% endfor %}

</div>


<script>
function addToCart(name, price) {
    fetch("/add_to_cart", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({name: name, price: price})
    })
    .then(res => {
        if (res.status === 401) {
            window.location.href = "/login"; // go login if not logged in
        } else {
            window.location.href = "/cart";  // go to billing/cart
        }
    });
}
</script>


{% endblock %}
