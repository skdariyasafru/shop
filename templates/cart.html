{% extends "base.html" %}

{% block title %}Cart{% endblock %}

{% block content %}

<h2>Your Cart</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Subtotal</th>
    </tr>

    {% for item in items %}
    <tr>
        <td>{{ item.name }}</td>
        <td>₹{{ item.price }}</td>
        <td>{{ item.quantity }}</td>
        <td>₹{{ item.subtotal }}</td>
    </tr>
    {% endfor %}
</table>

<h3>Total: ₹{{ total }}</h3>

<form action="/checkout" method="post">
    <button type="submit">Checkout</button>
</form>

<a href="/">← Continue Shopping</a>

{% endblock %}
