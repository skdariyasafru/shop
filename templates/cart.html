{% for item in items %}
<tr id="row-{{ item.product_id }}">

    <td>{{ item.name }}</td>

    <td>₹{{ item.price }}</td>

    <td>
        <div id="cart-control-{{ item.product_id }}">
            <div class="qty-control">
                <button class="qty-btn"
                    onclick="changeQty({{ item.product_id }}, 'decrease')">-</button>

                <span id="qty-{{ item.product_id }}" class="qty-number">
                    {{ item.quantity }}
                </span>

                <button class="qty-btn"
                    onclick="changeQty({{ item.product_id }}, 'increase')">+</button>
            </div>
        </div>
    </td>

    <td>
        ₹<span id="subtotal-{{ item.product_id }}">
            {{ item.subtotal }}
        </span>
    </td>

</tr>
{% endfor %}
